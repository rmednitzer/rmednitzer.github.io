# Off-site link rot, checked on a schedule rather than on pull requests:
# a rate-limited or bot-filtered host is not a reason to block a merge.
name: external-links

on:
  schedule:
    # Mondays, 05:20 UTC
    - cron: '20 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  external-links:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: External links are reachable
        run: python3 .github/scripts/check_links.py --external
