name: publish-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Do not cancel a deployment already in progress.
concurrency:
  group: public-github-pages
  cancel-in-progress: false

jobs:
  package:
    if: github.server_url == 'https://github.com' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Validate reviewed source and publication contract
        run: python3 .github/scripts/validate_site.py
      - name: Stage only approved public files
        run: |
          python3 .github/scripts/stage_site.py
          python3 .github/scripts/stage_site.py --verify
          cd _site
          python3 ../.github/scripts/check_links.py
          python3 ../.github/scripts/check_csp_hashes.py
          python3 ../.github/scripts/check_asset_versions.py
      - name: Upload the public artifact only
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
          name: public-site-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          retention-days: 1

  deploy:
    needs: package
    if: github.server_url == 'https://github.com' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Refuse a stale-main deployment
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          current=$(gh api "repos/$REPOSITORY/commits/main" --jq .sha)
          test "$current" = "$EXPECTED_SHA"
      - name: Deploy the reviewed public artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: public-site-${{ github.run_id }}-${{ github.run_attempt }}
