name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: html-validate
        run: npx -y html-validate@11.16.1 index.html legal.html

      - name: sitemap is well-formed XML
        run: python3 -c "import xml.dom.minidom; xml.dom.minidom.parse('sitemap.xml')"

      - name: manifest and settings are valid JSON
        run: |
          python3 - <<'EOF'
          import json
          json.load(open('site.webmanifest'))
          json.load(open('.claude/settings.json'))
          EOF

      - name: JSON-LD blocks parse
        run: |
          python3 - <<'EOF'
          import re, json
          for page in ('index.html', 'legal.html'):
              html = open(page).read()
              blocks = re.findall(r'<script type="application/ld\+json">(.*?)</script>', html, re.S)
              assert blocks, f'no JSON-LD found in {page}'
              for b in blocks:
                  json.loads(b)
          EOF

      - name: CSP hashes match inline content
        run: python3 .github/scripts/check_csp_hashes.py

      - name: Palette meets its contrast budget
        run: python3 .github/scripts/check_contrast.py

      - name: Internal links, assets, and anchors resolve
        run: python3 .github/scripts/check_links.py
